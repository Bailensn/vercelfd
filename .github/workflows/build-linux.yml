name: Build Linux AMD64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Dming4 Linux
    runs-on: ubuntu-22.04
    container:
      image: debian:10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true

      - name: Install Gio dependencies
        run: |
          apt update
          apt install -y \
            pkg-config \
            build-essential \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxfixes-dev \
            libegl1-mesa-dev \
            libvulkan-dev

      - name: Download Go modules
        run: |
          go mod download

      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o Dming4

      - name: Check binary
        run: |
          file Dming4
          ldd Dming4 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Dming4-linux-amd64
          path: Dming4
