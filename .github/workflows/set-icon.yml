name: Set EXE Icon

on:
  workflow_dispatch:
    inputs:
      exe_path:
        description: "EXE file path (relative to repository root)"
        required: true
        type: string

      icon_path:
        description: "ICO icon path (relative to repository root)"
        required: true
        type: string

jobs:
  set-icon:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rcedit
        run: |
          npm install rcedit

      - name: Set EXE icon
        shell: pwsh
        run: |
          .\node_modules\rcedit\bin\rcedit.exe `
            "${{ inputs.exe_path }}" `
            --set-icon "${{ inputs.icon_path }}"

      - name: Upload modified EXE
        uses: actions/upload-artifact@v4
        with:
          name: exe-with-icon
          path: ${{ inputs.exe_path }}